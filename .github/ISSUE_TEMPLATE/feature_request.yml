name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request

        Thank you for suggesting a new feature!

        Please fill out as much information as possible to help us understand your request.

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: A brief summary of the feature you're requesting.
      placeholder: "Brief summary of your feature..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: |
        Please describe the problem or limitation that this feature would solve.
        Why do you need this feature?
      placeholder: |
        Describe the problem or motivation...
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Proposed Solution
      description: |
        Describe the feature you'd like to see.
        How should it work? What should it do?
      placeholder: |
        Describe the proposed solution...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: |
        Describe any alternative solutions you've considered.
        What are the trade-offs?
      placeholder: |
        Describe alternatives...

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / Examples
      description: |
        If applicable, add mockups, diagrams, or examples to help explain the feature.
      placeholder: |
        Add mockups or examples...

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request here.
      placeholder: |
        Add any other context here...

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing feature requests
          required: true
        - label: This is a new feature, not a duplicate request
          required: true
        - label: I understand this feature may not be implemented immediately
          required: true
